{% extends 'base.html' %}

{% block title %}Edit Profile - ConnectHub{% endblock %}

{% block content %}
<div class="edit-profile-page">
    <h1>Edit Profile</h1>
    <div class="edit-card">
        <form method="post" enctype="multipart/form-data" class="edit-form">
            {% csrf_token %}
            <div class="profile-pic-section">
                <div class="current-pic" id="profilePicContainer">
                    {% if user.profile.profile_pic %}
                    <img id="profilePicImg" src="{{ user.profile.profile_pic.url }}" alt="Profile">
                    {% else %}
                    <span id="profilePicSpan">{{ user.username|first|upper }}</span>
                    {% endif %}
                </div>
                <label for="id_profile_pic" class="btn btn-secondary btn-sm">Change Photo</label>
                <input type="file" name="profile_pic" id="id_profile_pic" accept="image/*" style="display:none">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}">
                </div>
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio" rows="3">{{ user.profile.bio }}</textarea>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" value="{{ user.profile.location }}">
            </div>
            <div class="form-group">
                <label>Birth Date</label>
                <input type="date" name="birth_date" value="{{ user.profile.birth_date|date:'Y-m-d'|default:'' }}">
            </div>
            <div class="form-actions">
                <a href="{% url 'profile' username=user.username %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
