{% extends 'base.html' %}

{% block title %}Edit Profile - ShopEase{% endblock %}

{% block content %}
<div class="edit-profile-page">
    <h1>Edit Profile</h1>

    <div class="edit-profile-card">
        <form method="post" class="edit-profile-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ profile_user.username }}" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ profile_user.first_name }}">
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ profile_user.last_name }}">
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ profile_user.email }}" required>
            </div>
            <div class="form-actions">
                <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
